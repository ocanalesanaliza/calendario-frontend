<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Sitio en mantenimiento</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { align-items: center; background: #f4f7fb; color: #14213d; display: flex; margin: 0; min-height: 100vh; padding: 24px; }
      main { background: #fff; border-radius: 16px; box-shadow: 0 16px 40px rgba(20, 33, 61, .12); margin: auto; max-width: 600px; padding: 48px 32px; text-align: center; width: 100%; }
      h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); margin: 0 0 20px; }
      p { color: #40516f; font-size: 1.1rem; line-height: 1.6; margin: 0 auto; max-width: 460px; }
      .maintenance-image {
        display: block;
        height: auto;
        margin: 0 auto 24px;
        
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="maintenance-image" src="/mantenimiento.png" alt="" width="220" height="220">
      <h1>Estamos realizando tareas de mantenimiento</h1>
      <p>El sitio no está disponible temporalmente. Por favor, intentá nuevamente más tarde.</p>
    </main>
  </body>
</html>
