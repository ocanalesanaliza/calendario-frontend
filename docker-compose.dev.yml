# Frontend en modo desarrollo (Vite con recarga en caliente).
# Usa el backend que ya corre en http://localhost:8010.
# Puerto 3080: es el origen permitido por CORS_ALLOWED_ORIGINS del backend local.
#
#   docker compose -f docker-compose.dev.yml up
services:
  frontend:
    image: node:22-alpine
    container_name: calendario_frontend_dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3080 --strictPort"
    environment:
      VITE_API_URL: http://localhost:8010
      # OneDrive/Windows no propaga eventos de archivos al contenedor: sondeo para la recarga.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3080:3080"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
